  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <div class="main-col">
    <header class="topbar" id="topbar">
      <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg class="i" aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>
      <div class="topbar-title">
        <p class="breadcrumb" id="breadcrumb">Golden Crust</p>
        <h1 id="page-title" tabindex="-1">Overview</h1>
      </div>

      <div class="global-search" id="global-search">
        <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
        <input type="search" id="global-search-input" placeholder="Search products or receipts…" autocomplete="off"
               aria-label="Search products or transactions" role="combobox" aria-expanded="false" aria-controls="global-search-results" aria-autocomplete="list">
        <kbd aria-hidden="true">/</kbd>
        <div class="popover search-results" id="global-search-results" role="listbox" hidden></div>
      </div>

      <div class="topbar-actions">
        <span class="topbar-date" id="topbar-date"></span>
        <button type="button" class="icon-btn search-btn" id="search-btn" aria-label="Search products or receipts" aria-controls="global-search" aria-expanded="false">
          <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
        </button>
        <div class="popover-anchor">
          <button type="button" class="icon-btn" id="notif-btn" aria-label="Stock alerts" aria-haspopup="true" aria-expanded="false" aria-controls="notif-panel">
            <svg class="i" aria-hidden="true"><use href="#i-bell"></use></svg>
            <span class="notif-dot" id="notif-dot" hidden></span>
          </button>
          <div class="popover notif-panel" id="notif-panel" hidden></div>
        </div>
        <div class="popover-anchor">
          <button type="button" class="profile-btn" id="profile-btn" aria-haspopup="true" aria-expanded="false" aria-controls="profile-menu">
            <span class="avatar" aria-hidden="true">AD</span>
            <span class="profile-name">Admin</span>
            <svg class="i i-sm" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
          </button>
          <div class="popover profile-menu" id="profile-menu" role="menu" hidden></div>
        </div>
        <a class="btn btn-primary" href="#/pos" id="new-sale-btn" aria-label="New sale"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg><span class="btn-label">New sale</span></a>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1" aria-live="off">
      <div class="page-loading" role="status"><span class="spinner" aria-hidden="true"></span>Loading Golden Crust…</div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
